name: Publish to PyPI

# Tag-driven release. Push a tag matching v* (e.g. v0.1.0, v0.2.3) to
# trigger a build + publish to PyPI via OIDC trusted publishing. No
# long-lived API tokens are stored in the repo; PyPI authenticates the
# workflow run using a short-lived OIDC token issued by GitHub.
#
# PyPI-side setup (one-time, before the first tag push):
#   1. Sign in to https://pypi.org.
#   2. Account settings -> Publishing -> Add a new pending publisher.
#   3. Fill in:
#         PyPI project name:   presidio-sg-recognizers
#         Owner:               pdpa-tools
#         Repository name:     presidio-sg-recognizers
#         Workflow filename:   publish.yml
#         Environment name:    pypi
#   4. Save. The first successful run of this workflow will claim the
#      project name and convert the pending publisher into a configured
#      publisher bound to this specific repo + workflow + environment.
#
# GitHub-side setup (one-time):
#   1. Repo Settings -> Environments -> New environment -> "pypi".
#   2. (Optional but recommended) Add a required reviewer or a wait
#      timer so a human approves each release.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment binding is what PyPI's trusted publisher
    # configuration checks against. Keep this name in sync with the
    # "Environment name" field in PyPI's pending-publisher dialog.
    environment:
      name: pypi
      url: https://pypi.org/p/presidio-sg-recognizers
    permissions:
      # id-token: write is the load-bearing permission for OIDC. Without
      # it the publish action cannot mint a token PyPI will accept.
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
